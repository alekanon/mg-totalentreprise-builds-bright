      - generic [ref=f7e115]:
        - generic [ref=f7e116]: En entreprenør med noget på hjerte
        - heading "Alle vores byggerier starter med et helstøbt menneske" [level=1] [ref=f7e117]
        - paragraph [ref=f7e118]: Det er på vores bygge- og anlægsprojekter at fagligheden mødes, innovationen sker og samarbejdet skabes. Derfor sætter vi projekterne øverst på dagsordenen og skaber de bedste rammer for menneskerne på - og omkring - vores projekter.
        - link "Se alle vores projekter her" [ref=f7e119] [cursor=pointer]:
          - /url: /projekter
      - article [ref=f7e131]:
        - heading "En forretning på tre stærke ben" [level=2] [ref=f7e132]
        - paragraph [ref=f7e135]: MT Højgaard Danmark har tre stærke forretningsben indenfor anlæg, nybyggeri og renovering. Samtidig løser vi løbende mindre håndværksopgaver med vores store egenproduktion. Vi har kontinuerligt mange projekter under udførelse i størrelser fra flere milliarder og ned til nogle få hundredetusinde kroner.

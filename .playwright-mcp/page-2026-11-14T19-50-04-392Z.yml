                      - paragraph [ref=f19e117]: Vi engagerer os aktivt i at udvikle kontorejendomme, der er skabt til en produktiv og sund arbejdsdag med godt indeklima og godt dagslys.
                - listitem "Slide 3 af 3" [ref=f19e118]:

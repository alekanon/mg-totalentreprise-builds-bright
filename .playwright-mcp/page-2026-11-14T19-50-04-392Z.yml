                        - button [ref=f19e126]
                      - paragraph [ref=f19e129]: I samarbejde med hoteloperatører, udvikler vi hoteller på populære lokationer nær metrostationer, S-tog og motorvejsnettet.
        - generic [ref=f19e131]:
          - heading "Godt at vide om vores ejendomsudvikling" [level=2] [ref=f19e133]
          - generic [ref=f19e134]:
            - paragraph [ref=f19e137]: Vi udvikler boliger, kontorer og hoteller af høj kvalitet på gode lokaliteter med kort afstand til offentlig transport.
            - paragraph [ref=f19e140]: Vi er med i hele værdikæden fra grundkøb, design, projektering, opførelse, udlejning, drift - og salg til investorer fra ind- og udland.
            - paragraph [ref=f19e143]: Skanska er en verdens største udviklings- og entreprenørvirksomheder med 26.000 medarbejdere i Norden, Europa og USA.
            - paragraph [ref=f19e146]: Vores danske projekter certificeres minimum til DGNB Guld. Skanskakoncernen har som mål at blive CO2-neutral i 2045.
        - generic [ref=f19e148]:
